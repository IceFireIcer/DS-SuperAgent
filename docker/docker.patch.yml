# Image-owned overlay: the container is the sandbox boundary, so only full
# access is offered. DS_SUPERAGENT_WORKSPACE supplies the product workspace. The
# webserver bind host/port come from a second overlay the entrypoint writes.
- id: permission
  config:
    presets:
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: Full access
        description: The container is the boundary. Agents can change every file it can see.
    defaultPreset: danger-full-access
