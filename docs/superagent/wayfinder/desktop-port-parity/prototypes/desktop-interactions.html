<style>
  :root { color-scheme: light; font: 14px/1.55 system-ui, "Segoe UI", sans-serif; color: #262723; background: #f5f5f2; --review-ink: #262723; --review-muted: #575b56; --review-line: #dedfd8; --review-paper: #fff; --review-focus: #3659d2; }
  *, *::before, *::after { box-sizing: border-box; }
  body { max-width: 1760px; margin: 0 auto; padding: 24px clamp(14px, 2.6vw, 44px) 20px; }
  [hidden] { display: none !important; }
  .review-top { display: flex; align-items: end; justify-content: space-between; gap: 16px 30px; flex-wrap: wrap; margin-bottom: 18px; }
  .review-top h1 { margin: 0; font-size: clamp(22px, 2vw, 29px); line-height: 1.2; font-weight: 650; letter-spacing: -.025em; }
  .review-top p { margin: 7px 0 0; color: var(--review-muted); font-size: 13px; }
  .review-preferences { display: flex; flex-wrap: wrap; gap: 8px; }
  .review-preferences label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--review-muted); }
  select, button { font: inherit; color: inherit; }
  select { min-height: 34px; background: var(--review-paper); border: 1px solid var(--review-line); border-radius: 8px; padding: 5px 24px 5px 9px; }
  button { cursor: pointer; }
  :is(button, select, a, iframe):focus-visible { outline: 2px solid var(--review-focus); outline-offset: 2px; }
  .review-grid { display: grid; grid-template-columns: minmax(0, 1fr) 248px; gap: 20px; align-items: start; }
  .review-stage { min-width: 0; padding: 0; display: flex; justify-content: center; }
  .review-frame { display: block; width: 100%; height: clamp(520px, calc(100dvh - 158px), 920px); background: #fcfcfc; border: 1px solid #d6d8d2; border-radius: 14px; box-shadow: 0 16px 34px -24px #20252261, 0 2px 6px #242a2310; transition: width .28s ease, background-color .12s ease; }
  .review-stage[data-size="narrow"] .review-frame { width: min(600px, 100%); }
  .review-stage[data-reduced] .review-frame { transition: none; }
  .review-rail { border-left: 1px solid var(--review-line); padding: 4px 0 8px 16px; min-width: 0; }
  .review-scenario { display: grid; gap: 6px; font-weight: 600; }
  .review-scenario select { width: 100%; font-weight: 500; }
  .review-rail h2 { font-size: 13px; margin: 18px 0 6px; }
  .review-rail p { margin: 5px 0; }
  .review-rail ol { margin: 12px 0 0; padding-left: 21px; }
  .review-rail li { padding-inline-start: 2px; margin-bottom: 7px; font-size: 13px; color: var(--review-muted); }
  .review-events { display: flex; flex-wrap: wrap; gap: 6px; }
  .review-events button, .review-reset { min-height: 32px; border: 1px solid var(--review-line); border-radius: 8px; background: var(--review-paper); padding: 4px 8px; font-size: 12px; text-align: left; }
  .review-events button:hover:not(:disabled), .review-reset:hover { background: #e9eae4; }
  .review-events button:disabled { cursor: default; opacity: .5; }
  .review-state { padding: 10px 0 0; margin-top: 14px; border-top: 1px solid var(--review-line); font-size: 12px; overflow-wrap: anywhere; }
  .review-state strong { font-weight: 600; }
  .review-state p { color: var(--review-muted); }
  .review-reset { margin-top: 12px; }
  .review-source { color: var(--review-muted); font-size: 12px; margin: 13px 0 0; }
  @media (max-width: 830px) {
    .review-grid { grid-template-columns: minmax(0, 1fr); gap: 16px; }
    .review-rail { border-left: 0; border-top: 1px solid var(--review-line); padding: 12px 0 0; }
    .review-frame { height: max(560px, 72dvh); }
  }
  @media (prefers-reduced-motion: reduce) { .review-frame { transition: none; } }
</style>
<body>
  <header class="review-top">
    <div>
      <h1>桌面交互样板</h1>
      <p>DS SuperAgent · 离线模拟</p>
    </div>
    <div class="review-preferences" role="group" aria-label="预览条件">
      <label>窗口 <select id="size"><option value="wide">宽窗</option><option value="narrow">窄窗</option></select></label>
      <label>主题 <select id="theme"><option value="deepseek">DeepSeek</option><option value="mono">Mono</option><option value="paper">Paper</option><option value="moonlight">Moonlight</option></select></label>
      <label>外观 <select id="scheme"><option value="light">浅色</option><option value="dark">深色</option></select></label>
      <label>动效 <select id="motion"><option value="system">跟随系统</option><option value="normal">普通</option><option value="reduce">减少</option></select></label>
    </div>
  </header>
  <main class="review-grid">
    <div id="stage" class="review-stage">
      <iframe id="desktop" class="review-frame" title="DS SuperAgent 桌面预览" sandbox="allow-scripts allow-forms"></iframe>
    </div>
    <aside class="review-rail" aria-label="验收场景">
      <label class="review-scenario">验收路径
        <select id="scenario">
          <option value="workspace">侧栏目录与输入框</option>
          <option value="settings">账户、设置与模型</option>
          <option value="voice">连续语音与提问</option>
          <option value="activity">角色状态与工作回执</option>
          <option value="boot">启动交接与重试</option>
        </select>
      </label>
      <ol id="steps"></ol>
      <div id="event-group" hidden><h2>模拟事件</h2><div class="review-events" id="events"></div></div>
      <div class="review-state" role="status"><strong id="state-title">正在载入</strong><p id="state-detail"></p></div>
      <button class="review-reset" id="reset" type="button">重置场景</button>
    </aside>
  </main>
  <p class="review-source">参考 DS-Bot v0.3.8（5e9b7da8）与 DS SuperAgent UI 设计标准。场景使用样例数据。</p>

9519\\u4E86\\u3002\",Diagnostics:\"\\u8BCA\\u65AD\\u4FE1\\u606F\",\"Versions, system, models, and the latest errors. Saved keys, tokens, and your home folder are hidden.\":\"\\u7248\\u672C\\u3001\\u7CFB\\u7EDF\\u3001\\u6A21\\u578B\\u548C\\u6700\\u8FD1\\u7684\\u9519\\u8BEF\\u3002\\u5DF2\\u4FDD\\u5B58\\u7684\\u5BC6\\u94A5\\u3001\\u4EE4\\u724C\\u548C\\u4F60\\u7684\\u7528\\u6237\\u76EE\\u5F55\\u90FD\\u5DF2\\u9690\\u85CF\\u3002\",Show:\"\\u67E5\\u770B\",Hide:\"\\u6536\\u8D77\",\"GitHub issue\":\"GitHub issue\",\"Opens a new issue in the DS SuperAgent repository with all of this filled in. Nothing is sent until you submit it there.\":\"\\u5728 DS SuperAgent \\u4ED3\\u5E93\\u65B0\\u5EFA\\u4E00\\u4E2A issue\\uFF0C\\u5E76\\u586B\\u597D\\u4EE5\\u4E0A\\u5185\\u5BB9\\u3002\\u4F60\\u5728 GitHub \\u4E0A\\u63D0\\u4EA4\\u4E4B\\u524D\\uFF0C\\u4EC0\\u4E48\\u90FD\\u4E0D\\u4F1A\\u53D1\\u51FA\\u3002\",\"Report on GitHub\":\"\\u5728 GitHub \\u4E0A\\u62A5\\u544A\",\"Copied the diagnostics.\":\"\\u5DF2\\u590D\\u5236\\u8BCA\\u65AD\\u4FE1\\u606F\\u3002\",\"Could not copy. Select the text below and copy it.\":\"\\u65E0\\u6CD5\\u590D\\u5236\\u3002\\u8BF7\\u9009\\u4E2D\\u4E0B\\u9762\\u7684\\u6587\\u5B57\\u624B\\u52A8\\u590D\\u5236\\u3002\",\"Opened a new GitHub issue with the diagnostics filled in. Check it before you submit.\":\"\\u5DF2\\u6253\\u5F00\\u65B0\\u7684 GitHub issue\\uFF0C\\u8BCA\\u65AD\\u4FE1\\u606F\\u5DF2\\u586B\\u597D\\u3002\\u63D0\\u4EA4\\u524D\\u8BF7\\u68C0\\u67E5\\u4E00\\u904D\\u3002\",\"Opened a new GitHub issue. The diagnostics are long, so they are on the clipboard: paste them into the issue.\":\"\\u5DF2\\u6253\\u5F00\\u65B0\\u7684 GitHub issue\\u3002\\u8BCA\\u65AD\\u4FE1\\u606F\\u592A\\u957F\\uFF0C\\u5DF2\\u590D\\u5236\\u5230\\u526A\\u8D34\\u677F\\uFF0C\\u8BF7\\u7C98\\u8D34\\u5230 issue \\u91CC\\u3002\",\"Opened a new GitHub issue. Copy the diagnostics below into it.\":\"\\u5DF2\\u6253\\u5F00\\u65B0\\u7684 GitHub issue\\u3002\\u8BF7\\u628A\\u4E0B\\u9762\\u7684\\u8BCA\\u65AD\\u4FE1\\u606F\\u590D\\u5236\\u8FDB\\u53BB\\u3002\",\"Downloaded the log. Keys, tokens, and your home folder are hidden in it.\":\"\\u5DF2\\u4E0B\\u8F7D\\u65E5\\u5FD7\\u3002\\u91CC\\u9762\\u7684\\u5BC6\\u94A5\\u3001\\u4EE4\\u724C\\u548C\\u7528\\u6237\\u76EE\\u5F55\\u90FD\\u5DF2\\u9690\\u85CF\\u3002\",\"Cleared the error log.\":\"\\u5DF2\\u6E05\\u7A7A\\u9519\\u8BEF\\u65E5\\u5FD7\\u3002\",\"Recent errors\":\"\\u6700\\u8FD1\\u7684\\u9519\\u8BEF\",\"Recent errors \\xB7 {count}\":\"\\u6700\\u8FD1\\u7684\\u9519\\u8BEF \\xB7 {count}\",\"No errors recorded.\":\"\\u6CA1\\u6709\\u9519\\u8BEF\\u8BB0\\u5F55\\u3002\",\"Failed model calls and DS SuperAgent problems show here, newest first.\":\"\\u6A21\\u578B\\u8C03\\u7528\\u5931\\u8D25\\u548C DS SuperAgent \\u7684\\u95EE\\u9898\\u4F1A\\u663E\\u793A\\u5728\\u8FD9\\u91CC\\uFF0C\\u6700\\u65B0\\u7684\\u5728\\u524D\\u3002\",\"Model call\":\"\\u6A21\\u578B\\u8C03\\u7528\",\"This window\":\"\\u8FD9\\u4E2A\\u7A97\\u53E3\",\"Error log\":\"\\u9519\\u8BEF\\u65E5\\u5FD7\",\"Kept on this computer across restarts, up to about 1 MB.\":\"\\u4FDD\\u5B58\\u5728\\u8FD9\\u53F0\\u7535\\u8111\\u4E0A\\uFF0C\\u91CD\\u542F\\u540E\\u4ECD\\u5728\\uFF0C\\u6700\\u591A\\u7EA6 1 MB\\u3002\",Clear:\"\\u6E05\\u7A7A\",\"Settings \\u2192 Feedback has the details.\":\"\\u8BE6\\u60C5\\u89C1 \\u8BBE\\u7F6E \\u2192 \\u53CD\\u9988\\u3002\",\"Could not reach DSH. Check that it is still running.\":\"\\u8FDE\\u4E0D\\u4E0A DSH\\uFF0C\\u8BF7\\u786E\\u8BA4\\u5B83\\u8FD8\\u5728\\u8FD0\\u884C\\u3002\",\"{name} could not answer: {reason}\":\"{name} \\u6CA1\\u80FD\\u56DE\\u7B54\\uFF1A{reason}\",\"Unknown error\":\"\\u672A\\u77E5\\u9519\\u8BEF\",\"The API key was rejected\":\"API \\u5BC6\\u94A5\\u65E0\\u6548\",\"The account is out of quota\":\"\\u8D26\\u6237\\u989D\\u5EA6\\u5DF2\\u7528\\u5C3D\",\"Too many requests to the model\":\"\\u6A21\\u578B\\u8BF7\\u6C42\\u592A\\u9891\\u7E41\",\"The conversation is too long for the model\":\"\\u5BF9\\u8BDD\\u592A\\u957F\\uFF0C\\u8D85\\u51FA d by work\":\"\\u5DF2\\u8FDB\\u5165\\u539F\\u5DE5\\u4F5C\",\"Pending delivery\":\"\\u7B49\\u5F85\\u6295\\u9012\",Blocked:\"\\u53D7\\u963B\",Missed:\"\\u5DF2\\u9519\\u8FC7\",\"Delivery failed\":\"\\u6295\\u9012\\u5931\\u8D25\",\"Choose an authorized work item.\":\"\\u8BF7\\u9009\\u62E9\\u5DF2\\u6388\\u6743\\u7684\\u5DE5\\u4F5C\\u9879\\u3002\",\"Time zone\":\"\\u65F6\\u533A\",Minutes:\"\\u5206\\u949F\",\"View work\":\"\\u67E5\\u770B\\u5DE5\\u4F5C\",\"Schedule source\":\"\\u65E5\\u7A0B\\u6765\\u6E90\",\"Scheduled tasks are paused; existing work continues.\":\"\\u5B9A\\u65F6\\u4EFB\\u52A1\\u5DF2\\u6682\\u505C\\uFF0C\\u73B0\\u6709\\u5DE5\\u4F5C\\u7EE7\\u7EED\\u8FD0\\u884C\\u3002\",\"Every day\":\"\\u6BCF\\u5929\",\"Every {count} days\":\"\\u6BCF {count} \\u5929\",\"Every hour\":\"\\u6BCF\\u5C0F\\u65F6\",\"Every {count} hours\":\"\\u6BCF {count} \\u5C0F\\u65F6\",\"Every {count} minutes\":\"\\u6BCF {count} \\u5206\\u949F\",\"Once, {time}\":\"\\u4E00\\u6B21\\uFF0C{time}\",\"Every day at {time}\":\"\\u6BCF\\u5929 {time}\",\"Every {days} at {time}\":\"\\u6BCF{days} {time}\",\"Every weekday at {time}\":\"\\u6BCF\\u4E2A\\u5DE5\\u4F5C\\u65E5 {time}\",\"Every weekend at {time}\":\"\\u6BCF\\u4E2A\\u5468\\u672B {time}\",\"On the schedule {expression}\":\"\\u6309\\u8BA1\\u5212 {expression}\",\"Next: {time}\":\"\\u4E0B\\u6B21 {time}\",Finished:\"\\u5DF2\\u7ED3\\u675F\",\"in {name}\":\"\\u5728 {name}\",\"Click again to delete\":\"\\u518D\\u70B9\\u4E00\\u6B21\\u5220\\u9664\",\"Delete task\":\"\\u5220\\u9664\\u4EFB\\u52A1\",Once:\"\\u4E00\\u6B21\",\"Every week\":\"\\u6BCF\\u5468\",Repeat:\"\\u91CD\\u590D\",minutes:\"\\u5206\\u949F\",hours:\"\\u5C0F\\u65F6\",days:\"\\u5929\",\"Morning briefing\":\"\\u65E9\\u95F4\\u7B80\\u62A5\",\"What to do\":\"\\u8981\\u505A\\u4EC0\\u4E48\",\"Sum up what changed since yesterday and what needs me today.\":\"\\u603B\\u7ED3\\u4E00\\u4E0B\\u6628\\u5929\\u4EE5\\u6765\\u7684\\u53D8\\u5316\\uFF0C\\u4EE5\\u53CA\\u4ECA\\u5929\\u9700\\u8981\\u6211\\u5904\\u7406\\     const get = id => document.getElementById(id)
    const desktop = get('desktop')
    const systemMotion = matchMedia('(prefers-reduced-motion: reduce)')
    const scenarios = {
      workspace: ['在侧栏用方向键选择 Release notes，再从输入框核对选中项。', '发送一条消息，观察下一条的目录复位。Activity 中的在途工作仍使用原目录。', '重开目录菜单，用 Esc 或点击空白处关闭，检查焦点。'],
      settings: ['打开左下角 Account，用方向键进入 Models and API keys。', '打开模型菜单。按一次 Esc 回到模型按钮，再按一次回到 Account。', '试 Connectors 快捷入口和 Main 的模型引导。密钥演示使用 sample-key。'],
      voice: ['在空输入框点右侧波形，再提交一条模拟转录。收到别的回复时仍等待本轮。', '对照收到本轮回复、朗读完成、停止回复这几种状态。', '问题卡出现或隐藏窗口后要手动继续。停止后台工作不会暂停语音。'],
      activity: ['用模拟事件观察角色磁贴、工作项与 Main 回复之间的状态差别。', '收到问题时输入位由问题卡接管。切到减少动态效果，核对状态仍然可读。'],
      boot: ['点 Main 就绪，观察鲸鱼进入顶部胶囊，随后可直接输入。', '模拟启动失败后点 Retry。切换到减少动态效果，再走一遍交接。'],
    }
    const eventCopy = {
      transcript: '提交模拟转录', otherReply: '收到别的回复', mainReply: '收到本轮回复', speechEnded: '朗读完成',
      question: '收到问题', hide: '隐藏窗口', show: '恢复窗口', stopWork: '停止后台工作', deny: '麦克风被拒',
      sendError: '发送失败', workStart: 'Worker 开始', workDone: 'Worker 完成', workFail: 'Worker 失败',
      mainReady: 'Main 就绪', bootFail: '启动失败',
    }
    const dispatch = data => desktop.contentWindow?.postMessage({ preview: 'desktop', ...data }, '*')
    function changeAppearance() {
      const motion = get('motion').value
      const reduced = motion === 'reduce' || motion === 'system' && systemMotion.matches
      get('stage').dataset.size = get('size').value
      get('stage').toggleAttribute('data-reduced', reduced)
      dispatch({ type: 'appearance', theme: get('theme').value, dark: get('scheme').value === 'dark', reduced })
    }
    function startScenario() {
      const choice = get('scenario').value
      get('steps').replaceChildren(...scenarios[choice].map(text => Object.assign(document.createElement('li'), { textContent: text })))
      dispatch({ type: 'scenario', choice })
    }
    function showEvents(events) {
      const panel = get('events')
      get('event-group').hidden = events.length === 0
      const active = document.activeElement
      const current = Array.from(panel.children, button => button.dataset.event)
      if (current.join(',') !== events.map(event => event.name).join(',')) {
        panel.replaceChildren(...events.map(({ name }) => {
          const button = document.createElement('button')
          button.type = 'button'
          button.dataset.event = name
          button.textContent = eventCopy[name]
          button.addEventListener('click', () => dispatch({ type: 'event', name }))
          return button
        }))
        if (active.dataset.event && !active.isConnected) panel.querySelector('button')?.focus()
      }
      events.forEach(({ enabled }, index) => { panel.children[index].disabled = !enabled })
    }
    window.addEventListener('message', event => {
      if (event.source !== desktop.contentWindow || event.data?.preview !== 'desktop') return
      if (event.data.type === 'ready') { changeAppearance(); startScenario() }
      if (event.data.type === 'state') {
        get('state-title').textContent = event.data.title
        get('state-detail').textContent = event.data.detail
        showEvents(event.data.events)
      }
    })
    for (const id of ['size', 'theme', 'scheme', 'motion']) get(id).addEventListener('change', changeAppearance)
    get('scenario').addEventListener('change', startScenario)
    get('reset').addEventListener('click', startScenario)
    systemMotion.addEventListener('change', changeAppearance)
    desktop.srcdoc = previewHtml
  </script>
