<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">DS SuperAgent current architecture map</title>
  <desc id="desc">A three-tier Main, Router and Worker runtime with a domain core, work control plane, local and remote execution, durable state, delivery, supervision and watchdog boundaries.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1118"/>
      <stop offset=".55" stop-color="#101820"/>
      <stop offset="1" stop-color="#0c141c"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143349"/>
      <stop offset="1" stop-color="#0d202c"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb86b"/>
      <stop offset=".5" stop-color="#ff6b5e"/>
      <stop offset="1" stop-color="#71d6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#d8e4ee" stroke-opacity=".035" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#d8e4ee" fill-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#71d6ff"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb86b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#82dfb0"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ff8f91"/>
    </marker>
    <style>
      .kicker { font: 700 12px/1.2 "Cascadia Mono", "SFMono-Regular", Consolas, monospace; letter-spacing: 2.1px; fill: #8192a3; }
      .label { font: 600 15px/1.25 "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #e7eef4; }
      .sub { font: 400 12.5px/1.35 "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #9dabba; }
      .tiny { font: 500 10.5px/1.25 "Cascadia Mono", "SFMono-Regular", Consolas, monospace; fill: #718292; letter-spacing: .5px; }
      .head { font: 700 30px/1.15 "Iowan Old Style", "Palatino Linotype", "Songti SC", Georgia, serif; fill: #f2f5f7; }
      .group { font: 700 12px/1.2 "Cascadia Mono", "SFMono-Regular", Consolas, monospace; letter-spacing: 1.8px; fill: #9fb0bf; }
      .node { fill: #121d27; stroke: #2b3d4c; stroke-width: 1.2; }
      .node-control { fill: #102532; stroke: #327694; }
      .node-work { fill: #281f12; stroke: #9b6d2c; }
      .node-state { fill: #12241d; stroke: #397459; }
      .node-external { fill: #28171a; stroke: #8f4b52; }
      .flow { fill: none; stroke: #71d6ff; stroke-width: 1.8; marker-end: url(#arrowCyan); }
      .flow-work { fill: none; stroke: #ffb86b; stroke-width: 1.8; marker-end: url(#arrowAmber); }
      .flow-state { fill: none; stroke: #82dfb0; stroke-width: 1.6; marker-end: url(#arrowGreen); }
      .flow-external { fill: none; stroke: #ff8f91; stroke-width: 1.5; stroke-dasharray: 7 7; marker-end: url(#arrowRose); }
      .trace { fill: none; stroke: url(#signal); stroke-width: 2.4; stroke-dasharray: 9 12; animation: travel 12s linear infinite; }
      .pulse { animation: pulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .delay-1 { animation-delay: -1.1s; }
      .delay-2 { animation-delay: -2.2s; }
      .bracket { fill: none; stroke: #3b4f5f; stroke-width: 1; }
      @keyframes travel { to { stroke-dashoffset: -168; } }
      @keyframes pulse { 0%,100% { opacity: .45; transform: scale(.88); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) {
        .trace, .pulse { animation: none; }
      }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <rect width="1600" height="1000" fill="url(#dots)" opacity=".65"/>

  <g>
    <text x="64" y="54" class="kicker">DS-SUPERAGENT / CURRENT RUNTIME</text>
    <text x="64" y="91" class="head">一个产品表面，三个 Agent 世界，六个控制边界</text>
    <text x="64" y="118" class="sub">Main 连续对话 · Router 计划与协调 · Worker 隔离执行 · Core 保存可解释的工作事实</text>
  </g>

  <g transform="translate(1110 38)">
    <rect x="0" y="0" width="426" height="88" rx="16" class="node" opacity=".94"/>
    <circle cx="26" cy="28" r="4" fill="#71d6ff"/>
    <text x="40" y="32" class="tiny">CONTROL / WORK / STATE</text>
    <circle cx="26" cy="54" r="4" fill="#ffb86b"/>
    <text x="40" y="58" class="tiny">EVIDENCE / DELIVERY / AUTHORITY</text>
    <text x="280" y="32" class="tiny">SNAPSHOT</text>
    <text x="280" y="58" class="label" style="font-size:13px">d03bb434</text>
  </g>

  <!-- ingress -->
  <text x="64" y="168" class="group">01 / INGRESS &amp; HUMAN SURFACE</text>
  <g filter="url(#shadow)">
    <rect x="64" y="184" width="220" height="74" rx="14" class="node node-control"/>
    <rect x="300" y="184" width="220" height="74" rx="14" class="node node-control"/>
    <rect x="536" y="184" width="220" height="74" rx="14" class="node node-control"/>
    <rect x="772" y="184" width="220" height="74" rx="14" class="node node-control"/>
    <rect x="1008" y="184" width="220" height="74" rx="14" class="node node-control"/>
    <rect x="1244" y="184" width="292" height="74" rx="14" class="node node-control"/>
  </g>
  <g>
    <text x="84" y="214" class="label">Human / Main</text>
    <text x="84" y="236" class="sub">chat, questions, stop / resume</text>
    <text x="320" y="214" class="label">GitHub</text>
    <text x="320" y="236" class="sub">issue, PR, review, CI</text>
    <text x="556" y="214" class="label">Feishu</text>
    <text x="556" y="236" class="sub">OAuth, thread, native reply</text>
    <text x="792" y="214" class="label">Schedule</text>
    <text x="792" y="236" class="sub">versioned occurrence</text>
    <text x="1028" y="214" class="label">IM / Mail</text>
    <text x="1028" y="236" class="sub">accounts, reading, reply</text>
    <text x="1264" y="214" class="label">Phone Link</text>
    <text x="1264" y="236" class="sub">paired relay, Main-only, revocable</text>
  </g>

  <!-- arrows from ingress -->
  <path d="M174 258 V286 H238 V312" class="flow"/>
  <path d="M410 258 V286 H438 V312" class="flow"/>
  <path d="M646 258 V286 H672 V312" class="flow"/>
  <path d="M882 258 V286 H846 V312" class="flow"/>

  <!-- control plane -->
  <rect x="64" y="286" width="812" height="318" rx="24" fill="url(#coreGlow)" stroke="#25495d" filter="url(#shadow)"/>
  <text x="88" y="318" class="group">02 / THREE-TIER CONTROL PLANE</text>
  <path d="M88 334 H852" stroke="#244355" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="92" y="356" width="206" height="134" rx="18" class="node node-control"/>
    <rect x="336" y="338" width="250" height="174" rx="22" fill="#0c1b25" stroke="#4e91ab" stroke-width="1.6"/>
    <rect x="624" y="356" width="206" height="134" rx="18" class="node node-control"/>
  </g>
  <g>
    <circle cx="114" cy="380" r="5" fill="#71d6ff" class="pulse"/>
    <text x="128" y="385" class="label">Main Agent</text>
    <text x="112" y="410" class="sub">one continuous session</text>
    <text x="112" y="430" class="sub">WorkBrief + bounded evidence</text>
    <text x="112" y="462" class="tiny">TOOLS · 4 + MEMORY</text>
  </g>
  <g>
    <text x="358" y="367" class="kicker" style="fill:#61c7ec">DOMAIN CORE</text>
    <text x="358" y="395" class="label" style="font-size:17px">Ticket / Mandate / Assignment</text>
    <text x="358" y="419" class="sub">durable command + effect + receipt</text>
    <text x="358" y="439" class="sub">Host lease · epoch · writer fence</text>
    <text x="358" y="459" class="sub">generation-bound callbacks</text>
    <text x="358" y="484" class="tiny">THE WRITE AUTHORITY</text>
    <circle cx="562" cy="360" r="7" fill="#71d6ff" opacity=".22" filter="url(#softGlow)"/>
  </g>
  <g>
    <circle cx="646" cy="380" r="5" fill="#71d6ff" class="pulse delay-1"/>
    <text x="660" y="385" class="label">Router Agent</text>
    <text x="644" y="410" class="sub">1–4 independent WorkItems</text>
    <text x="644" y="430" class="sub">plan, route, notify Main</text>
    <text x="644" y="462" class="tiny">NO SHELL / NO FILE TOOLS</text>
  </g>

  <path d="M298 423 H336" class="flow"/>
  <path d="M586 423 H624" class="flow"/>
  <path d="M195 356 V326 H727 V356" fill="none" stroke="#38586a" stroke-width="1.1" stroke-dasharray="4 6"/>

  <g transform="translate(92 516)">
    <rect x="0" y="0" width="738" height="58" rx="14" fill="#0b1720" stroke="#243b49"/>
    <text x="18" y="22" class="tiny">DELIVERY &amp; AUTHORITY</text>
    <text x="18" y="43" class="sub">Outbox purposes · acknowledgement / answer / attention / result · unknown requires reconciliation</text>
    <rect x="644" y="11" width="76" height="36" rx="18" fill="#163329" stroke="#3f8062"/>
    <text x="682" y="34" class="tiny" text-anchor="middle" style="fill:#9ce7bd">FENCED</text>
  </g>

  <!-- worker / work plane -->
  <rect x="900" y="286" width="636" height="318" rx="24" fill="#1d1710" stroke="#7a5728" filter="url(#shadow)"/>
  <text x="926" y="318" class="group" style="fill:#d9a45d">03 / WORK PLANE</text>
  <path d="M926 334 H1512" stroke="#5b4322" stroke-width="1"/>

  <g filter="url(#shadow)">
    <rect x="928" y="356" width="250" height="134" rx="18" class="node node-work"/>
    <rect x="1208" y="356" width="300" height="134" rx="18" class="node node-work"/>
  </g>
  <g>
    <circle cx="950" cy="380" r="5" fill="#ffb86b" class="pulse delay-2"/>
    <text x="964" y="385" class="label">Worker Session</text>
    <text x="948" y="410" class="sub">one Ticket, one active Assignment</text>
    <text x="948" y="430" class="sub">own Session / directory / model route</text>
    <text x="948" y="462" class="tiny">REPORT_READY · ASK_HUMAN</text>
  </g>
  <g>
    <text x="1228" y="382" class="label" style="font-size:14px">Capability surface</text>
    <text x="1228" y="406" class="sub">jobs · PTY · subagent · preview</text>
    <text x="1228" y="426" class="sub">browser · MCP · Office · memory</text>
    <text x="1228" y="446" class="sub">files · search · commands · views</text>
    <text x="1228" y="470" class="tiny">AUTHORIZED PER WORK / ENVIRONMENT</text>
  </g>
  <path d="M836 423 H900" class="flow-work"/>
  <path d="M1178 423 H1208" class="flow-work"/>

  <g transform="translate(928 516)">
    <rect x="0" y="0" width="580" height="58" rx="14" fill="#1b160f" stroke="#4d3b20"/>
    <text x="18" y="22" class="tiny" style="fill:#d6a35e">SCHEDULING</text>
    <text x="18" y="43" class="sub">default slots: 2 normal + 1 human priority · background work keeps its slot</text>
  </g>

  <!-- execution -->
  <text x="64" y="652" class="group">04 / EXECUTION WORLD</text>
  <g filter="url(#shadow)">
    <rect x="64" y="670" width="370" height="150" rx="20" class="node node-work"/>
    <rect x="458" y="670" width="418" height="150" rx="20" class="node node-work"/>
  </g>
  <g>
    <text x="88" y="702" class="label">Local Environment</text>
    <text x="88" y="726" class="sub">selected workspace · host user · native tools</text>
    <text x="88" y="746" class="sub">prepare / retry / handoff evidence</text>
    <text x="88" y="778" class="tiny">DEFAULT DESKTOP WORLD</text>
  </g>
  <g>
    <text x="482" y="702" class="label">Remote Device / BYOM</text>
    <text x="482" y="726" class="sub">X25519 + Ed25519 + AES-GCM · pinned identity</text>
    <text x="482" y="746" class="sub">files · search · commands · assets · skills</text>
    <text x="482" y="778" class="tiny">EXPLICIT PAIRING · NO SILENT LOCAL FALLBACK</text>
  </g>
  <path d="M249 640 V670" class="flow-work"/>
  <path d="M667 640 V670" class="flow-work"/>
  <path d="M434 745 H458" class="flow-work" opacity=".8"/>
  <text x="446" y="806" class="tiny" text-anchor="middle">handoff</text>

  <!-- persistence -->
  <rect x="900" y="630" width="636" height="302" rx="24" fill="#0d1f18" stroke="#31664e" filter="url(#shadow)"/>
  <text x="926" y="662" class="group" style="fill:#8ad7aa">05 / STATE · EVIDENCE · OPERATIONS</text>
  <path d="M926 678 H1512" stroke="#29533f" stroke-width="1"/>
  <g>
    <rect x="928" y="700" width="282" height="92" rx="16" class="node node-state"/>
    <rect x="1228" y="700" width="272" height="92" rx="16" class="node node-state"/>
    <rect x="928" y="814" width="282" height="92" rx="16" class="node node-state"/>
    <rect x="1228" y="814" width="272" height="92" rx="16" class="node node-state"/>
  </g>
  <g>
    <text x="948" y="728" class="label">Business Store</text>
    <text x="948" y="751" class="sub">SQLite / PostgreSQL</text>
    <text x="948" y="773" class="tiny">records + receipts + instance lock</text>
    <text x="1248" y="728" class="label">Session Store</text>
    <text x="1248" y="751" class="sub">DSH public persistence</text>
    <text x="1248" y="773" class="tiny">writer epoch · append · replay</text>
    <text x="948" y="842" class="label">Effects / Outbox</text>
    <text x="948" y="865" class="sub">ordered lanes + idempotency</text>
    <text x="948" y="887" class="tiny">pending / sent / dropped / unknown</text>
    <text x="1248" y="842" class="label">Context &amp; Evidence</text>
    <text x="1248" y="865" class="sub">4–16 KiB pages + next refs</text>
    <text x="1248" y="887" class="tiny">chain of recall · leak-scanned output</text>
  </g>
  <path d="M470 614 H782 V744 H900" class="flow-state"/>
  <path d="M1518 423 H1560 V575 H562 V630" class="flow-state" opacity=".55"/>
  <path d="M1200 630 V592" class="flow-state"/>
  <text x="1222" y="615" class="tiny">reports / questions / outcomes</text>

  <!-- supervision and watchdog -->
  <g transform="translate(64 858)">
    <rect x="0" y="0" width="812" height="74" rx="18" class="node node-external"/>
    <text x="20" y="25" class="group" style="fill:#ff9ca0">06 / OUTER CONTROL LOOPS</text>
    <text x="20" y="50" class="sub">Semantic Supervisor · every 5 min · inspect → proposal → human approval</text>
    <text x="510" y="50" class="sub">Watchdog · external process · restart / takeover / budget</text>
  </g>
  <path d="M876 895 H900" class="flow-external"/>
  <path d="M876 895 H922 V592" class="flow-external" opacity=".58"/>
  <text x="884" y="912" class="tiny">observe only</text>
  <text x="884" y="928" class="tiny">write requires approval</text>

  <g transform="translate(64 958)">
    <circle cx="5" cy="5" r="4" fill="#71d6ff"/>
    <text x="18" y="9" class="tiny">control</text>
    <circle cx="105" cy="5" r="4" fill="#ffb86b"/>
    <text x="118" y="9" class="tiny">work</text>
    <circle cx="185" cy="5" r="4" fill="#82dfb0"/>
    <text x="198" y="9" class="tiny">state</text>
    <circle cx="265" cy="5" r="4" fill="#ff8f91"/>
    <text x="278" y="9" class="tiny">outer control</text>
    <text x="1110" y="9" class="tiny">Evidence paths: superagent/src · README · implementation records · test suite</text>
  </g>
</svg>
