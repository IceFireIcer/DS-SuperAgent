name: Release

# Publishes ds-superagent to npm when a GitHub release is published, then attaches the desktop app's
# Windows installer, macOS zips and Linux packages to the release. Windows and the Linux
# AppImage update from latest.yml / latest-linux.yml; macOS and the Linux deb open the release
# page for a manual download.
#
# npm Trusted Publishing: npm trusts this workflow through GitHub's OIDC token, so the
# repository keeps no npm token, and every version gets a provenance statement. It is set
# up once on npmjs.com: package ds-superagent → Settings → Trusted Publisher → GitHub Actions,
# user IceFireIcer, repository DS-SuperAgent, workflow release.yml, no environment.
#
# The release tag must be v<version in superagent/package.json> and must point at a commit on
# main. A version with a pre-release part (0.2.0-rc.1) goes to the npm tag "next", so that
# "latest" stays on the last stable version.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and pack the package, but do not publish
        type: boolean
        default: true

permissions:
  # write: attach the package file to the release.
  contents: write
  id-token: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validation:
    name: Full pre-release validation
    uses: ./.github/workflows/test.yml
    with:
      full: true
    secrets: inherit

  publish:
    name: Check and publish
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: superagent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: superagent/package-lock.json
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11.6.2 --no-fund --no-audit

      - name: Check the tag and the branch
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::The release tag is $TAG, but superagent/package.json has version $version. Tag v$version or change the version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points at a commit that is not on main. Release from main."
            exit 1
          fi

      - name: Check the app version
        run: |
          version="$(node -p "require('./package.json').version")"
          app="$(node -p "require('../app/package.json').version")"
          if [ "$app" != "$version" ]; then
            echo "::error::app/package.json has version $app, but superagent/package.json has $version. Give both the same version."
            exit 1
          fi

      - run: npm ci --no-fund --no-audit
      # The reusable validation already ran the complete test/compatibility/package matrix.

      - name: Pack (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm pack --dry-run

      - name: Publish
        if: github.event_name == 'release' || (!inputs.dry_run && github.ref == 'refs/heads/main')
        run: |
          tag="$(node -p "require('./package.json').version.includes('-') ? 'next' : 'latest'")"
          echo "Publishing $(node -p "require('./package.json').version") with the npm tag $tag"
          npm publish --provenance --access public --tag "$tag"

      # The release keeps the package file for installs without npm.
      - name: Attach the package to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          npm pack
          gh release upload "$TAG" "ds-superagent-$(node -p "require('./package.json').version").tgz" --clobber

  app-windows:
    name: Desktop app installer (Windows)
    needs: publish
    runs-on: windows-latest
    timeout-minutes: 30
    # Every package job checks out the workflow SHA explicitly so the build record has one candidate commit.
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the installer for the build record and real-device checks
        uses: actions/upload-artifact@v4
        with:
          name: DS-SuperAgent-win-x64
          path: app/dist-pack/DS-SuperAgent-*-win-x64.exe
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

      - name: Attach the installer to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          installer="dist-pack/DS-SuperAgent-$(node -p "require('./package.json').version")-win-x64.exe"
          gh release upload "$TAG" "$installer" "$installer.blockmap" dist-pack/latest.yml --clobber

  app-macos:
    name: Desktop app zip (macOS ${{ matrix.arch }})
    needs: publish
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Keep the zip for the build record and real-device checks
        uses: actions/upload-artifact@v4
        with:
          name: DS-SuperAgent-mac-${{ matrix.arch }}
          path: app/dist-pack/DS-SuperAgent-*-mac-${{ matrix.arch }}.zip
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the zip to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          zip="dist-pack/DS-SuperAgent-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          gh release upload "$TAG" "$zip" --clobber

  app-linux:
    name: Desktop app packages (Linux x64)
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packaged app
        # Ubuntu 24.04's AppArmor blocks the unprivileged user namespaces that Chromium's
        # sandbox needs; the release runner may lift that restriction (it is its own machine).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/check-packed.mjs
      - name: Check the files for the release
        # The dry run never uploads, so it checks here that every file the release attaches exists.
        run: |
          version="$(node -p "require('./package.json').version")"
          ls -l "dist-pack/DS-SuperAgent-$version-linux-x86_64.AppImage" "dist-pack/DS-SuperAgent-$version-linux-amd64.deb" dist-pack/latest-linux.yml
      - name: Keep the packages for the build record and real-device checks
        uses: actions/upload-artifact@v4
        with:
          name: DS-SuperAgent-linux-x64
          path: |
            app/dist-pack/DS-SuperAgent-*-linux-x86_64.AppImage
            app/dist-pack/DS-SuperAgent-*-linux-amd64.deb
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
      - name: Attach the packages to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        # The AppImage carries its block map inside the file, so there is no .blockmap to attach.
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "$TAG" "dist-pack/DS-SuperAgent-$version-linux-x86_64.AppImage" "dist-pack/DS-SuperAgent-$version-linux-amd64.deb" dist-pack/latest-linux.yml --clobber

  app-build-record:
    name: Desktop release-candidate build record
    needs:
      - app-windows
      - app-macos
      - app-linux
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require every desktop build job
        if: needs.app-windows.result != 'success' || needs.app-macos.result != 'success' || needs.app-linux.result != 'success'
        env:
          WINDOWS_RESULT: ${{ needs.app-windows.result }}
          MACOS_RESULT: ${{ needs.app-macos.result }}
          LINUX_RESULT: ${{ needs.app-linux.result }}
        run: |
          echo "::error::Desktop build matrix is incomplete: Windows=$WINDOWS_RESULT, macOS=$MACOS_RESULT, Linux=$LINUX_RESULT. A partial output is not a release candidate."
          exit 1

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Collect the platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: DS-SuperAgent-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify and hash the package matrix
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" != "$COMMIT_SHA" ]; then
            echo "::error::The build record checkout is $head_sha, but the candidate commit is $COMMIT_SHA."
            exit 1
          fi
          version="$(node -p "require('./app/package.json').version")"
          node scripts/desktop-build-record.mjs \
            --artifacts release-artifacts \
            --commit-sha "$COMMIT_SHA" \
            --version "$version" \
            --output "release-build-record/DS-SuperAgent-$version-$COMMIT_SHA-build-record.json"

      - name: Keep the build record
        uses: actions/upload-artifact@v4
        with:
          name: DS-SuperAgent-build-record-${{ github.sha }}
          path: release-build-record/*.json
          retention-days: 30
          if-no-files-found: error

      - name: Attach the build record to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release-build-record/*.json --clobber
