name: DS-SuperAgent CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      desktop_packages:
        description: Run the desktop install and update checks on Windows, macOS, and Linux
        type: boolean
        default: false
      desktop_preview:
        description: Build and exercise the Windows x64 public preview candidate only
        type: boolean
        default: false
      full:
        description: Run all release checks, including compatibility and install/update matrices
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name }}-${{ github.ref }}-${{ inputs.full || false }}-${{ inputs.desktop_packages || false }}-${{ inputs.desktop_preview || false }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  changes:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      superagent: ${{ steps.scope.outputs.superagent }}
      app: ${{ steps.scope.outputs.app }}
      mobile: ${{ steps.scope.outputs.mobile }}
      app_package: ${{ steps.scope.outputs.app_package }}
      desktop_preview: ${{ steps.scope.outputs.desktop_preview }}
      docker: ${{ steps.scope.outputs.docker }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
      shards: ${{ steps.scope.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Classify the changed paths
        id: scope
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ inputs.full || (github.event_name == 'pull_request' && github.base_ref == 'main') }}
          DESKTOP_PACKAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_packages }}
          DESKTOP_PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_preview }}
        run: |
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "desktop_preview=$DESKTOP_PREVIEW" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = true ]; then
            node scripts/change-scope.mjs --full --github-output
            echo 'shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=[1]' >> "$GITHUB_OUTPUT"
          fi
          if [ "$FULL" = true ]; then
            exit 0
          elif [ "$DESKTOP_PREVIEW" = true ]; then
            printf '%s\n' app_package=true app=false superagent=false mobile=false docker=false >> "$GITHUB_OUTPUT"
          elif [ "$DESKTOP_PACKAGES" = true ]; then
            printf '%s\n' app_package=true app=false superagent=false mobile=false docker=false >> "$GITHUB_OUTPUT"
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            node scripts/change-scope.mjs --all --github-output
          else
            node scripts/change-scope.mjs --base "$BASE" --head "${{ github.sha }}" --github-output
          fi

  scan:
    name: Leak scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test repository scripts
        run: node --test scripts/*.test.mjs
      - name: Check implementation evidence records
        run: node scripts/check-implementation-records.mjs
      - name: Check runtime product naming
        run: node scripts/check-product-naming.mjs
      # Scan exactly the tracked files, as they would be published.
      - run: mkdir -p "$RUNNER_TEMP/tree" && git archive HEAD | tar -x -C "$RUNNER_TEMP/tree"
      - run: node scripts/scan.mjs "$RUNNER_TEMP/tree"
        env:
          SCAN_EXTRA_PATTERNS: ${{ secrets.SCAN_EXTRA_PATTERNS }}

  superagent-check:
    name: Super-agent checks · Node 24
    needs: changes
    if: needs.changes.outputs.superagent == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: superagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: superagent/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Check committed client and Office bundles
        run: node dsh/scripts/build-client.mjs --check
      - run: npm run build
      - run: npm run typecheck
      - run: npm run lint
      - name: Run all product-client tests for daily changes
        if: needs.changes.outputs.full != 'true'
        run: npm run test:client

  superagent-tests:
    name: Super-agent ${{ needs.changes.outputs.full == 'true' && 'full' || 'smoke + changed tests' }} · shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.superagent == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    defaults:
      run:
        shell: bash
        working-directory: superagent
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: superagent/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Run daily smoke and directly related regression tests
        if: needs.changes.outputs.full != 'true'
        env:
          CI_TEST_BASE: ${{ needs.changes.outputs.base }}
        run: node ../scripts/superagent-ci-tests.mjs
      - name: Run the Windows Server shard for release validation
        if: needs.changes.outputs.full == 'true'
        run: node ../scripts/superagent-ci-tests.mjs --full --test-shard=${{ matrix.shard }}/4
      - name: Run every product-client test for release validation
        if: needs.changes.outputs.full == 'true'
        run: npm run test:client -- --test-shard=${{ matrix.shard }}/4

  superagent-pty:
    name: Super-agent Server PTY lifecycle · Ubuntu
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: superagent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: superagent/package-lock.json
      - run: npm ci --no-fund --no-audit
      - name: Run the native Server PTY fixture through natural exit
        run: node ../scripts/superagent-ci-tests.mjs --full

  superagent:
    name: Super-agent CI
    needs: [changes, superagent-check, superagent-tests, superagent-pty]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.superagent == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Require checks and every test shard
        env:
          CHECK_RESULT: ${{ needs.superagent-check.result }}
          TEST_RESULT: ${{ needs.superagent-tests.result }}
          FULL: ${{ needs.changes.outputs.full }}
          PTY_RESULT: ${{ needs.superagent-pty.result }}
        run: |
          test "$CHECK_RESULT" = success
          test "$TEST_RESULT" = success
          if [ "$FULL" = true ]; then test "$PTY_RESULT" = success; fi

  app:
    name: Desktop app profile
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      # The test composes the profile and starts no window, so it needs no Electron binary.
      - run: npm ci --no-fund --no-audit
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  mobile:
    name: Mobile app typecheck
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            superagent/package-lock.json
      - name: Install shared link dependencies
        run: npm ci --prefix ../superagent --no-fund --no-audit
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck

  app-package:
    name: Desktop app package (Windows)
    needs: changes
    if: needs.changes.outputs.app_package == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the Windows x64 public preview package
        env:
          DESKTOP_PREVIEW_EVIDENCE_DIR: ${{ runner.temp }}/desktop-preview
        run: node scripts/check-packed.mjs 'dist-pack/win-unpacked/DS SuperAgent.exe' --preview
      - name: Record the Windows x64 preview candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -LiteralPath dist-pack -Filter 'DS-SuperAgent-*-win-x64.exe' |
            Select-Object -First 1
          if (-not $installer) { throw 'The Windows installer was not built.' }
          $output = Join-Path $env:RUNNER_TEMP 'desktop-preview'
          New-Item -ItemType Directory -Force $output | Out-Null
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          [ordered]@{
            candidateSha = $env:GITHUB_SHA
            version = $version
            platform = 'windows'
            architecture = 'x64'
            distributionForm = 'nsis-installer'
            filename = $installer.Name
            sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'candidate.json') -Encoding utf8
      - name: Check Windows package coexistence and capture desktop visual cases
        run: |
          sha256sum dist-pack/DS-SuperAgent-*-win-x64.exe
          DESKTOP_VISUAL_DIR="$RUNNER_TEMP/desktop-visuals" node scripts/check-packed.mjs 'dist-pack/win-unpacked/DS SuperAgent.exe' --coexistence
      - name: Check packaged startup recovery and reduced-motion handoff
        run: |
          node scripts/check-packed-startup.mjs 'dist-pack/win-unpacked/DS SuperAgent.exe' "$RUNNER_TEMP/desktop-visuals/startup-normal"
          node scripts/check-packed-startup.mjs 'dist-pack/win-unpacked/DS SuperAgent.exe' "$RUNNER_TEMP/desktop-visuals/startup-reduced" --reduce-motion
      - name: Check work questions, Main stop and Work stop in the Windows package
        run: DESKTOP_CONTROLS_VISUAL_DIR="$RUNNER_TEMP/desktop-visuals" node scripts/check-packed.mjs 'dist-pack/win-unpacked/DS SuperAgent.exe' --controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-visuals-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-visuals
          if-no-files-found: ignore
      - name: Keep the Windows x64 preview candidate and evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DS-SuperAgent-win-x64-preview-${{ github.sha }}
          path: |
            app/dist-pack/DS-SuperAgent-*-win-x64.exe
            app/dist-pack/DS-SuperAgent-*-win-x64.exe.blockmap
            app/dist-pack/latest.yml
            ${{ runner.temp }}/desktop-preview
          if-no-files-found: warn
          compression-level: 0
      # The runner is a fresh machine, so the installer may run here. It must install for the
      # current user only, the installed app must pass the same check, and the uninstaller must
      # remove it again.
      - name: Seed product and former user data
        shell: pwsh
        run: |
          $legacyFolders = (Join-Path $HOME '.ds-bot'), (Join-Path $env:APPDATA 'DS Bot'), (Join-Path $env:APPDATA 'DeepSeek Bot')
          $folders = @((Join-Path $HOME '.ds-superagent'), (Join-Path $env:APPDATA 'DS SuperAgent')) + $legacyFolders
          $files = foreach ($folder in $folders) {
            New-Item -ItemType Directory -Force $folder | Out-Null
            $file = Join-Path $folder 'kept.txt'
            Set-Content -LiteralPath $file -Value 'kept'
            $file
          }
          "KEPT_FILES=$($files -join '|')" >> $env:GITHUB_ENV

      - name: Install and check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'DS SuperAgent*' }
          }
          $installer = Get-Item dist-pack/DS-SuperAgent-*-win-x64.exe
          $installed = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "The installer exited with $($installed.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\DS SuperAgent'
          $exe = Join-Path $dir 'DS SuperAgent.exe'
          if (-not (Test-Path $exe)) { throw "The installer did not put the app in $dir" }
          $entry = Find-Entry 'HKCU:'
          if (-not $entry) { throw 'No uninstall entry for the current user' }
          if (Find-Entry 'HKLM:') { throw 'The installer installed for all users' }
          node scripts/check-packed.mjs $exe
          if ($LASTEXITCODE -ne 0) { throw 'The installed app failed its check' }
          foreach ($file in ($env:KEPT_FILES -split '\|')) {
            if ((Get-Content -LiteralPath $file -Raw).Trim() -ne 'kept') { throw "Install changed $file" }
          }

      # Package jobs also run for desktop-only validation. Always exercise the update, including
      # release PRs that changed only the core. The next build supplies the update feed.
      - name: Build the next version
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: Update the installed app and check it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\DS SuperAgent\DS SuperAgent.exe'
          node scripts/check-packed.mjs $exe --update-feed dist-next dist-next/win-unpacked/resources/app.asar
          if ($LASTEXITCODE -ne 0) { throw 'The installed app did not preserve the isolated profile during the update' }
          function Installed-Version {
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' |
              ForEach-Object { Get-ItemProperty $_.PSPath } |
              Where-Object { $_.DisplayName -like 'DS SuperAgent*' } |
              Select-Object -ExpandProperty DisplayVersion
          }
          if ((Installed-Version) -ne $env:NEXT_VERSION) { throw "The installed version is $(Installed-Version), not $env:NEXT_VERSION" }
          foreach ($file in ($env:KEPT_FILES -split '\|')) {
            if ((Get-Content -LiteralPath $file -Raw).Trim() -ne 'kept') { throw "Update changed $file" }
          }

      - name: Uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Find-Entry($root) {
            Get-ChildItem "$root\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like 'DS SuperAgent*' }
          }
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\DS SuperAgent'
          $exe = Join-Path $dir 'DS SuperAgent.exe'
          $uninstaller = Join-Path $dir 'Uninstall DS SuperAgent.exe'
          Start-Process -FilePath $uninstaller -ArgumentList '/currentuser', '/S' -WindowStyle Hidden -Wait
          # The uninstaller goes on from a copy in the temp folder, so wait for its result.
          $deadline = (Get-Date).AddSeconds(120)
          while (((Test-Path $exe) -or (Find-Entry 'HKCU:')) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
          if (Test-Path $exe) { throw 'The uninstaller left the app in place' }
          if (Find-Entry 'HKCU:') { throw 'The uninstaller left its uninstall entry' }
          foreach ($file in ($env:KEPT_FILES -split '\|')) {
            if ((Get-Content -LiteralPath $file -Raw).Trim() -ne 'kept') { throw "Uninstall changed $file" }
          }

  app-package-macos:
    name: Desktop app package (macOS ${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.app_package == 'true' && needs.changes.outputs.desktop_preview != 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: macos-latest }
          - { arch: x64, runner: macos-26-intel }
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
        env:
          # Ad-hoc identity '-' uses no certificate or secret, so PR signing is safe; otherwise electron-builder skips signing and leaves an unsealed bundle.
          CSC_FOR_PULL_REQUEST: 'true'
      - name: Check the zip
        run: |
          zip="dist-pack/DS-SuperAgent-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          test -f "$zip"
          shasum -a 256 "$zip"
      - name: Check the packaged app
        run: node scripts/check-packed.mjs
      - name: Install from the zip and check
        run: |
          zip="dist-pack/DS-SuperAgent-$(node -p "require('./package.json').version")-mac-${{ matrix.arch }}.zip"
          ditto -x -k "$zip" /Applications
          app="/Applications/DS SuperAgent.app"
          exe="$app/Contents/MacOS/DS SuperAgent"
          codesign --verify --deep --strict "$app"
          file "$exe"
          expected="${{ matrix.arch }}"
          if [ "$expected" = x64 ]; then expected=x86_64; fi
          file -b "$exe" | grep -F "$expected"
          node scripts/check-packed.mjs "$exe"
          node scripts/check-update.mjs "$exe" 99.0.0

  app-package-linux:
    name: Desktop app package (Linux x64)
    needs: changes
    if: needs.changes.outputs.app_package == 'true' && needs.changes.outputs.desktop_preview != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            superagent/package-lock.json
      - name: Build the Super-agent file dependency
        run: |
          npm ci --prefix ../superagent --no-fund --no-audit
          npm run build --prefix ../superagent
      - run: npm ci --no-fund --no-audit
      - run: npm run dist
      - name: Check the packages
        run: |
          version="$(node -p "require('./package.json').version")"
          test -f "dist-pack/DS-SuperAgent-$version-linux-x86_64.AppImage"
          test -f "dist-pack/DS-SuperAgent-$version-linux-amd64.deb"
          test -f dist-pack/latest-linux.yml
          sha256sum "dist-pack/DS-SuperAgent-$version-linux-x86_64.AppImage" "dist-pack/DS-SuperAgent-$version-linux-amd64.deb"
      # An AppImage mounts through FUSE 2, and Ubuntu 24.04's AppArmor blocks the unprivileged
      # user namespaces that Chromium's sandbox needs; a throwaway runner may lift that.
      - name: Prepare to run the app
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfuse2t64 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check Main from the released AppImage
        run: |
          version="$(node -p "require('./package.json').version")"
          xvfb-run -a node scripts/check-packed.mjs "dist-pack/DS-SuperAgent-$version-linux-x86_64.AppImage"
      # apt-get, not dpkg: it also installs the deb's dependencies. The ./ prefix makes apt-get
      # read a file; without it the path is taken for a package name.
      - name: Install the deb and check
        run: |
          version="$(node -p "require('./package.json').version")"
          sudo apt-get install -y "./dist-pack/DS-SuperAgent-$version-linux-amd64.deb"
          test -f /usr/share/applications/ds-superagent.desktop
          xvfb-run -a node scripts/check-packed.mjs "/opt/DS SuperAgent/ds-superagent"
      # A deb cannot update itself: it points at the release page, as on macOS.
      - name: The deb's app hears of a new version
        run: xvfb-run -a node scripts/check-update.mjs "/opt/DS SuperAgent/ds-superagent" 99.0.0
      # Package validation must exercise AppImage replacement regardless of changed paths.
      - name: Build the next version
        run: |
          next="$(node -p "const [a, b, c] = require('./package.json').version.split(/[.-]/u); [a, b, Number(c) + 1].join('.')")"
          npx electron-builder --publish never -c.extraMetadata.version="$next" -c.directories.output=dist-next
      - name: The AppImage takes the update
        run: |
          tmp="$(mktemp -d)"
          cp dist-pack/DS-SuperAgent-*-linux-x86_64.AppImage "$tmp/ds-superagent.AppImage"
          chmod +x "$tmp/ds-superagent.AppImage"
          xvfb-run -a node scripts/check-update.mjs "$tmp/ds-superagent.AppImage" dist-next
          if pgrep -f -- "$tmp/ds-superagent.AppImage"; then
            echo 'The AppImage restarted after an ordinary quit.' >&2
            exit 1
          fi
          next="$(ls dist-next/DS-SuperAgent-*-linux-x86_64.AppImage)"
          test "$(sha512sum "$tmp/ds-superagent.AppImage" | cut -d' ' -f1)" = "$(sha512sum "$next" | cut -d' ' -f1)"
      - name: Uninstall
        run: |
          sudo apt-get remove -y ds-superagent
          test ! -e "/opt/DS SuperAgent/ds-superagent"

  docker:
    name: Docker startup and data migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, scan]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.scan.result == 'success' &&
      needs.changes.outputs.docker == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose -f docker-compose.yml config --quiet
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker build -f docker/Dockerfile -t ds-superagent:test .
      - run: node docker/test.mjs ds-superagent:test
      - name: Publish the tested image
        if: github.event_name == 'push' && github.repository == 'IceFireIcer/DS-SuperAgent'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_REPOSITORY: ${{ github.repository }}
          GHCR_BRANCH: ${{ github.ref_name }}
          GHCR_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GHCR_REPOSITORY,,}"
          case "$GHCR_BRANCH" in
            main) tag=latest ;;
            dev) tag=dev ;;
            *) exit 0 ;;
          esac
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
          docker tag ds-superagent:test "$image:sha-$GHCR_SHA"
          docker tag ds-superagent:test "$image:$tag"
          docker push "$image:sha-$GHCR_SHA"
          docker push "$image:$tag"

  # The one check that branch rules require. A job whose needs failed is skipped,
  # and GitHub counts a skipped required check as passed, so this job always runs.
  # It fails when a change requires a job and that job did not succeed. A job that
  # the change does not require may be skipped; it may never fail or be cancelled.
  result:
    name: Test result
    needs: [changes, scan, superagent, app, mobile, app-package, app-package-macos, app-package-linux, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          SCAN: ${{ needs.scan.result }}
          SCOPE_SUPERAGENT: ${{ needs.changes.outputs.superagent }}
          SCOPE_APP: ${{ needs.changes.outputs.app }}
          SCOPE_MOBILE: ${{ needs.changes.outputs.mobile }}
          SCOPE_APP_PACKAGE: ${{ needs.changes.outputs.app_package }}
          SCOPE_DOCKER: ${{ needs.changes.outputs.docker }}
          RESULT_SUPERAGENT: ${{ needs.superagent.result }}
          RESULT_APP: ${{ needs.app.result }}
          RESULT_MOBILE: ${{ needs.mobile.result }}
          RESULT_APP_PACKAGE: ${{ needs.app-package.result }}
          RESULT_APP_PACKAGE_MACOS: ${{ needs.app-package-macos.result }}
          RESULT_APP_PACKAGE_LINUX: ${{ needs.app-package-linux.result }}
          RESULT_DOCKER: ${{ needs.docker.result }}
        run: node scripts/check-ci-result.mjs
